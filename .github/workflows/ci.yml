name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests/ -q

  root-tests:
    name: Root tests (parts A + C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run root tests
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run build

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose with required secrets
        env:
          POSTGRES_PASSWORD: ci-password
          AEZA_JWT_SECRET: ci-secret-value-not-for-production
          AEZA_ADMIN_EMAIL: ci@example.test
          AEZA_ADMIN_PASSWORD: ci-password
        run: docker compose config >/dev/null
      - name: Compose must fail closed without secrets
        run: |
          if docker compose config >/dev/null 2>&1; then
            echo "Compose started without required secrets; it must fail closed." >&2
            exit 1
          fi
