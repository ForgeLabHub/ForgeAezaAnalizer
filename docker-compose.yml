services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aeza}
      POSTGRES_USER: ${POSTGRES_USER:-aeza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      # Named volume so a clean checkout never depends on host-owned ./db/postgres.
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aeza} -d ${POSTGRES_DB:-aeza}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      # Inside the Compose network the API talks to the bundled Postgres.
      AEZA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aeza}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-aeza}
      AUTH_DATABASE: /app/db/auth.sqlite3
      AUTH_PRIVATE_KEY: /app/db/private_key.pem
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8080}
      AUTH_FRONTEND_LOGIN_URL: ${AUTH_FRONTEND_LOGIN_URL:-http://localhost:8080/login}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      # Seed a snapshot through the app's own validated importer.
      # Default: the official organiser dataset (10/30/100), which is what the
      # README acceptance table and the tests are written against. A larger
      # 40/120/370 presentation snapshot ships alongside it for demos; point
      # AEZA_SNAPSHOT_PATH at dataset/presentation.json to use it.
      AEZA_SEED_DEMO_DATA: "1"
      AEZA_SNAPSHOT_PATH: ${AEZA_SNAPSHOT_PATH:-/app/dataset/data.json}
      AEZA_AS_OF: ${AEZA_AS_OF:-2026-10-19T15:00:00+00:00}
      AEZA_ANALYTICS_FACTORY: ${AEZA_ANALYTICS_FACTORY:-backend.app.domain.module:create}
      AEZA_RECALCULATE_SECONDS: ${AEZA_RECALCULATE_SECONDS:-60}
      AEZA_METRICS_TOKEN: ${AEZA_METRICS_TOKEN:-}
      # The SPA is served through the same nginx origin, so the demo needs no
      # wildcard. Widen this only if you host the UI elsewhere.
      AEZA_CORS_ORIGINS: ${AEZA_CORS_ORIGINS:-http://localhost:8080}
      # --- Local AI, two conventions in one repo (both off by default) ---
      # (a) AI Analyst (backend/app/ai): grounded explanations + RAG.
      AEZA_AI_ENABLED: ${AEZA_AI_ENABLED:-0}
      AEZA_AI_PROVIDER: ${AEZA_AI_PROVIDER:-ollama}
      AEZA_AI_MODEL: ${AEZA_AI_MODEL:-qwen2.5:3b-instruct}
      AEZA_AI_BASE_URL: ${AEZA_AI_BASE_URL:-http://host.docker.internal:11434}
      AEZA_AI_MAX_TOKENS: ${AEZA_AI_MAX_TOKENS:-128}
      AEZA_AI_TIMEOUT_SECONDS: ${AEZA_AI_TIMEOUT_SECONDS:-10}
      # (b) Insights narration (backend/app/domain/llm.py). AEZA_OLLAMA_URL is
      # the canonical name and wins over the older AEZA_LLM_BASE_URL alias; both
      # are honoured so an existing .env keeps working.
      AEZA_LLM_ENABLED: ${AEZA_LLM_ENABLED:-0}
      AEZA_OLLAMA_URL: ${AEZA_OLLAMA_URL:-http://host.docker.internal:11434}
      AEZA_OLLAMA_MODEL: ${AEZA_OLLAMA_MODEL:-qwen2.5:3b-instruct}
      AEZA_OLLAMA_TIMEOUT_SECONDS: ${AEZA_OLLAMA_TIMEOUT_SECONDS:-90}
      AEZA_LLM_MAX_TOKENS: ${AEZA_LLM_MAX_TOKENS:-700}
      AEZA_LLM_TEMPERATURE: ${AEZA_LLM_TEMPERATURE:-0.2}
      # --- Outbound e-mail (SMTP.BZ) ---
      # Passed through from .env. SMTP_BZ_API_KEY stays empty when unset, which
      # disables sending; the key is never baked into the image.
      SMTP_BZ_API_KEY: ${SMTP_BZ_API_KEY:-}
      SMTP_BZ_FROM_EMAIL: ${SMTP_BZ_FROM_EMAIL:-}
      SMTP_BZ_FROM_NAME: ${SMTP_BZ_FROM_NAME:-}
      SMTP_BZ_API_URL: ${SMTP_BZ_API_URL:-https://api.smtp.bz/v1/smtp/send}
      SMTP_BZ_TIMEOUT_SECONDS: ${SMTP_BZ_TIMEOUT_SECONDS:-15}
    depends_on:
      db:
        condition: service_healthy
    # On Linux, host.docker.internal is not resolved automatically; this maps it
    # to the host gateway so the container can reach a host-run Ollama.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    # The auth module stores users in auth.sqlite3 and keeps its signing key here.
    volumes:
      # Named volume, not a bind mount. A bind mount of ./db/auth.sqlite3 would
      # create a *directory* in place of the file on a clean checkout (the file
      # is gitignored), and a bind mount of ./db would impose the host uid on
      # /app/db. Docker seeds this volume from the image's /app/db, which is
      # owned by the unprivileged app user, so the SQLite store is created on
      # first run with the right permissions.
      - auth_data:/app/db
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  auth_data:
  pg_data:
