services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aeza
      POSTGRES_USER: aeza
      POSTGRES_PASSWORD: aeza
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeza -d aeza"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      # Inside the Compose network the API talks to the bundled Postgres.
      AEZA_DATABASE_URL: postgresql+psycopg://aeza:aeza@db:5432/aeza
      # Change this before exposing the stack to anyone.
      AEZA_JWT_SECRET: ${AEZA_JWT_SECRET:-change-me-in-production}
      AEZA_ADMIN_EMAIL: ${AEZA_ADMIN_EMAIL:-analyst@aeza.test}
      AEZA_ADMIN_PASSWORD: ${AEZA_ADMIN_PASSWORD:-aeza-demo-password}
      AEZA_ALLOW_DEV_SECRET: "0"
      AEZA_SEED_DEMO_DATA: "1"
      AEZA_SNAPSHOT_PATH: backend/data/snapshot.json
      AEZA_AS_OF: ${AEZA_AS_OF:-2026-10-19T15:00:00+00:00}
      AEZA_ANALYTICS_FACTORY: ${AEZA_ANALYTICS_FACTORY:-}
      AEZA_RECALCULATE_SECONDS: ${AEZA_RECALCULATE_SECONDS:-60}
      AEZA_METRICS_TOKEN: ${AEZA_METRICS_TOKEN:-}
      AEZA_CORS_ORIGINS: "*"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pgdata:
