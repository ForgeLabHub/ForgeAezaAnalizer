services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aeza
      POSTGRES_USER: aeza
      POSTGRES_PASSWORD: aeza
    volumes:
      - ./db/postgres:/var/lib/postgresql/data
      - ./db/analytics_seed.sql:/docker-entrypoint-initdb.d/20-analytics-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeza -d aeza"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      # Inside the Compose network the API talks to the bundled Postgres.
      AEZA_DATABASE_URL: postgresql+psycopg://aeza:aeza@db:5432/aeza
      # Change this before exposing the stack to anyone.
      AEZA_JWT_SECRET: ${AEZA_JWT_SECRET:-change-me-in-production}
      AEZA_ADMIN_EMAIL: ${AEZA_ADMIN_EMAIL:-analyst@aeza.test}
      AEZA_ADMIN_PASSWORD: ${AEZA_ADMIN_PASSWORD:-demo123}
      AEZA_ALLOW_DEV_SECRET: "0"
      AEZA_SEED_DEMO_DATA: "0"
      AEZA_AUTH_DATABASE_URL: sqlite:////app/db/auth.sqlite3
      AEZA_AS_OF: ${AEZA_AS_OF:-2026-10-19T15:00:00+00:00}
      AEZA_ANALYTICS_FACTORY: ${AEZA_ANALYTICS_FACTORY:-backend.app.domain.module:create}
      AEZA_RECALCULATE_SECONDS: ${AEZA_RECALCULATE_SECONDS:-60}
      AEZA_METRICS_TOKEN: ${AEZA_METRICS_TOKEN:-}
      # The SPA is served through the same nginx origin, so the demo needs no
      # wildcard. Widen this only if you host the UI elsewhere.
      AEZA_CORS_ORIGINS: ${AEZA_CORS_ORIGINS:-http://localhost:8080}
      # Local LLM (Ollama). Off by default.
      #
      # AEZA_OLLAMA_URL is the canonical name and wins over the older
      # AEZA_LLM_BASE_URL alias; both are honoured so an existing .env keeps
      # working. The default is the Docker bridge gateway, which is where an
      # Ollama running on the host is reachable from inside the container
      # (172.18.0.1 on the default compose bridge; host.docker.internal also
      # resolves via the extra_hosts entry below).
      AEZA_LLM_ENABLED: ${AEZA_LLM_ENABLED:-0}
      AEZA_OLLAMA_URL: ${AEZA_OLLAMA_URL:-http://172.18.0.1:11434}
      AEZA_OLLAMA_MODEL: ${AEZA_OLLAMA_MODEL:-qwen2.5:7b}
      AEZA_OLLAMA_TIMEOUT_SECONDS: ${AEZA_OLLAMA_TIMEOUT_SECONDS:-90}
      AEZA_LLM_MAX_TOKENS: ${AEZA_LLM_MAX_TOKENS:-700}
      AEZA_LLM_TEMPERATURE: ${AEZA_LLM_TEMPERATURE:-0.2}
      # AI Analyst (backend/app/ai, routes under /api/v1/ai).  Off by default.
      # Unlike the aggregate assistant above, this surface reads AEZA_AI_* and
      # is grounded in a RAG index over docs/ (built into the image).
      # The model defaults to qwen2.5:7b, matching AEZA_OLLAMA_MODEL.
      AEZA_AI_ENABLED: ${AEZA_AI_ENABLED:-0}
      AEZA_AI_PROVIDER: ${AEZA_AI_PROVIDER:-mock}
      AEZA_AI_MODEL: ${AEZA_AI_MODEL:-qwen2.5:7b}
      AEZA_AI_BASE_URL: ${AEZA_AI_BASE_URL:-http://172.18.0.1:11434}
      AEZA_AI_TIMEOUT_SECONDS: ${AEZA_AI_TIMEOUT_SECONDS:-180}
      AEZA_AI_MAX_CONCURRENCY: ${AEZA_AI_MAX_CONCURRENCY:-1}
      AEZA_AI_NUM_CTX: ${AEZA_AI_NUM_CTX:-4096}
      AEZA_AI_MAX_TOKENS: ${AEZA_AI_MAX_TOKENS:-1200}
      AEZA_AI_TEMPERATURE: ${AEZA_AI_TEMPERATURE:-0.1}
      AEZA_AI_RAG_TOP_K: ${AEZA_AI_RAG_TOP_K:-2}
      AEZA_AI_MAX_RETRIES: ${AEZA_AI_MAX_RETRIES:-1}
    depends_on:
      db:
        condition: service_healthy
    # On Linux, host.docker.internal is not resolved automatically; this maps it
    # to the host gateway so the container can reach a host-run Ollama.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    # A named volume, not a bind mount: the SQLite store holds password hashes
    # and live sessions, so it must not live in the working tree or in Git. It
    # persists across `docker compose down` and is recreated empty on first boot.
    volumes:
      - aeza_auth:/app/db
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  aeza_auth:
