services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aeza}
      POSTGRES_USER: ${POSTGRES_USER:-aeza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aeza} -d ${POSTGRES_DB:-aeza}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      AEZA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aeza}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-aeza}
      AUTH_DATABASE: /app/db/auth.sqlite3
      AUTH_PRIVATE_KEY: /app/db/private_key.pem
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8080}
      AUTH_FRONTEND_LOGIN_URL: ${AUTH_FRONTEND_LOGIN_URL:-http://localhost:8080/login}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AEZA_SEED_DEMO_DATA: "1"
      AEZA_SNAPSHOT_PATH: ${AEZA_SNAPSHOT_PATH:-/app/dataset/data.json}
      AEZA_AS_OF: ${AEZA_AS_OF:-2026-10-19T15:00:00+00:00}
      AEZA_ANALYTICS_FACTORY: ${AEZA_ANALYTICS_FACTORY:-backend.app.domain.module:create}
      AEZA_RECALCULATE_SECONDS: ${AEZA_RECALCULATE_SECONDS:-60}
      AEZA_METRICS_TOKEN: ${AEZA_METRICS_TOKEN:-}
      AEZA_TELEGRAM_BOT_ENABLED: ${AEZA_TELEGRAM_BOT_ENABLED:-0}
      AEZA_TELEGRAM_POLLING_ENABLED: ${AEZA_TELEGRAM_POLLING_ENABLED:-0}
      AEZA_TELEGRAM_BOT_TOKEN: ${AEZA_TELEGRAM_BOT_TOKEN:-}
      AEZA_TELEGRAM_WEBHOOK_SECRET: ${AEZA_TELEGRAM_WEBHOOK_SECRET:-}
      AEZA_TELEGRAM_WEBHOOK_URL: ${AEZA_TELEGRAM_WEBHOOK_URL:-}
      AEZA_TELEGRAM_MINI_APP_URL: ${AEZA_TELEGRAM_MINI_APP_URL:-}
      AEZA_TELEGRAM_AUTH_MAX_AGE_SECONDS: ${AEZA_TELEGRAM_AUTH_MAX_AGE_SECONDS:-86400}
      AEZA_TELEGRAM_SESSION_TTL_SECONDS: ${AEZA_TELEGRAM_SESSION_TTL_SECONDS:-3600}
      AEZA_TELEGRAM_OTP_TTL_SECONDS: ${AEZA_TELEGRAM_OTP_TTL_SECONDS:-600}
      AEZA_TELEGRAM_OTP_RESEND_SECONDS: ${AEZA_TELEGRAM_OTP_RESEND_SECONDS:-60}
      AEZA_TELEGRAM_OTP_MAX_ATTEMPTS: ${AEZA_TELEGRAM_OTP_MAX_ATTEMPTS:-5}
      AEZA_TELEGRAM_WORKER_INTERVAL_SECONDS: ${AEZA_TELEGRAM_WORKER_INTERVAL_SECONDS:-180}
      AEZA_CORS_ORIGINS: ${AEZA_CORS_ORIGINS:-http://localhost:8080}
      AEZA_AI_ENABLED: ${AEZA_AI_ENABLED:-0}
      AEZA_AI_PROVIDER: ${AEZA_AI_PROVIDER:-ollama}
      AEZA_AI_MODEL: ${AEZA_AI_MODEL:-qwen2.5:3b-instruct}
      AEZA_AI_BASE_URL: ${AEZA_AI_BASE_URL:-http://host.docker.internal:11434}
      AEZA_AI_MAX_TOKENS: ${AEZA_AI_MAX_TOKENS:-1200}
      AEZA_AI_TIMEOUT_SECONDS: ${AEZA_AI_TIMEOUT_SECONDS:-420}
      AEZA_LLM_ENABLED: ${AEZA_LLM_ENABLED:-0}
      AEZA_OLLAMA_URL: ${AEZA_OLLAMA_URL:-http://host.docker.internal:11434}
      AEZA_OLLAMA_MODEL: ${AEZA_OLLAMA_MODEL:-qwen2.5:3b-instruct}
      AEZA_OLLAMA_TIMEOUT_SECONDS: ${AEZA_OLLAMA_TIMEOUT_SECONDS:-90}
      AEZA_LLM_MAX_TOKENS: ${AEZA_LLM_MAX_TOKENS:-700}
      AEZA_LLM_TEMPERATURE: ${AEZA_LLM_TEMPERATURE:-0.2}
      AEZA_EMAIL_PROVIDER: ${AEZA_EMAIL_PROVIDER:-}
      POSTBOX_SMTP_USERNAME: ${POSTBOX_SMTP_USERNAME:-}
      POSTBOX_SMTP_PASSWORD: ${POSTBOX_SMTP_PASSWORD:-}
      POSTBOX_SMTP_HOST: ${POSTBOX_SMTP_HOST:-postbox.cloud.yandex.net}
      POSTBOX_SMTP_PORT: ${POSTBOX_SMTP_PORT:-465}
      POSTBOX_FROM_EMAIL: ${POSTBOX_FROM_EMAIL:-}
      POSTBOX_FROM_NAME: ${POSTBOX_FROM_NAME:-}
      POSTBOX_TIMEOUT_SECONDS: ${POSTBOX_TIMEOUT_SECONDS:-15}
      SMTP_BZ_API_KEY: ${SMTP_BZ_API_KEY:-}
      SMTP_BZ_FROM_EMAIL: ${SMTP_BZ_FROM_EMAIL:-}
      SMTP_BZ_FROM_NAME: ${SMTP_BZ_FROM_NAME:-}
      SMTP_BZ_API_URL: ${SMTP_BZ_API_URL:-https://api.smtp.bz/v1/smtp/send}
      SMTP_BZ_TIMEOUT_SECONDS: ${SMTP_BZ_TIMEOUT_SECONDS:-15}
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - auth_data:/app/db
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  auth_data:
  pg_data:
