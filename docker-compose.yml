version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aeza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aeza}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      # Inside the Compose network the API talks to the bundled Postgres.
      AEZA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aeza}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-aeza}
      AUTH_DATABASE: /app/db/auth.sqlite3
      AUTH_PRIVATE_KEY: /app/db/private_key.pem
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8080}
      AUTH_FRONTEND_LOGIN_URL: ${AUTH_FRONTEND_LOGIN_URL:-http://localhost:8080/login}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      # Seed the official organiser dataset through the app's own validated
      # importer. Do NOT pre-load db/analytics_seed.sql: it holds a different
      # 60/115/285 fixture, not the official 10/30/100 snapshot.
      AEZA_SEED_DEMO_DATA: "1"
      AEZA_SNAPSHOT_PATH: /app/dataset/data.json
      AEZA_AS_OF: ${AEZA_AS_OF:-2026-10-19T15:00:00+00:00}
      AEZA_ANALYTICS_FACTORY: ${AEZA_ANALYTICS_FACTORY:-backend.app.domain.module:create}
      AEZA_RECALCULATE_SECONDS: ${AEZA_RECALCULATE_SECONDS:-60}
      AEZA_METRICS_TOKEN: ${AEZA_METRICS_TOKEN:-}
      # The SPA is served through the same nginx origin, so the demo needs no
      # wildcard. Widen this only if you host the UI elsewhere.
      AEZA_CORS_ORIGINS: ${AEZA_CORS_ORIGINS:-http://localhost:8080}
      # --- Local AI, two conventions in one repo (off by default) ---
      # AI Analyst (backend/app/ai): grounded explanations + RAG.
      AEZA_AI_ENABLED: ${AEZA_AI_ENABLED:-0}
      AEZA_AI_PROVIDER: ${AEZA_AI_PROVIDER:-ollama}
      AEZA_AI_MODEL: ${AEZA_AI_MODEL:-qwen2.5:3b-instruct}
      AEZA_AI_BASE_URL: ${AEZA_AI_BASE_URL:-http://docker.internal}
      # Insights narration. Keep disabled unless explicitly enabled in .env.
      AEZA_LLM_ENABLED: ${AEZA_LLM_ENABLED:-0}
      AEZA_OLLAMA_URL: ${AEZA_OLLAMA_URL:-http://docker.internal}
      AEZA_OLLAMA_MODEL: ${AEZA_OLLAMA_MODEL:-qwen2.5:3b-instruct}
      AEZA_OLLAMA_TIMEOUT_SECONDS: ${AEZA_OLLAMA_TIMEOUT_SECONDS:-90}
      AEZA_LLM_MAX_TOKENS: ${AEZA_LLM_MAX_TOKENS:-700}
      AEZA_LLM_TEMPERATURE: ${AEZA_LLM_TEMPERATURE:-0.2}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-https://telegram.org}
      TELEGRAM_TIMEOUT_SECONDS: ${TELEGRAM_TIMEOUT_SECONDS:-10}
      TELEGRAM_LINK_CODE_TTL_SECONDS: ${TELEGRAM_LINK_CODE_TTL_SECONDS:-600}
      TELEGRAM_LINK_MAX_ATTEMPTS: ${TELEGRAM_LINK_MAX_ATTEMPTS:-5}
      TELEGRAM_MIN_SEND_INTERVAL_SECONDS: ${TELEGRAM_MIN_SEND_INTERVAL_SECONDS:-3}
      TELEGRAM_MAX_RETRIES: ${TELEGRAM_MAX_RETRIES:-2}
      TELEGRAM_APP_BASE_URL: ${TELEGRAM_APP_BASE_URL:-http://localhost:8080}
      TELEGRAM_DIGEST_CHECK_SECONDS: ${TELEGRAM_DIGEST_CHECK_SECONDS:-300}
      TELEGRAM_DIGEST_HOUR_UTC: ${TELEGRAM_DIGEST_HOUR_UTC:-9}
    depends_on:
      db:
        condition: service_healthy
    # On Linux, host.docker.internal is not resolved automatically; this maps it
    # to the host gateway so the container can reach a host-run Ollama.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    # The auth module stores users in auth.sqlite3 and keeps its signing key here.
    volumes:
      # Named volume, not a bind mount. A bind mount of ./db/auth.sqlite3 would
      # create a *directory* in place of the file on a clean checkout (the file
      # is gitignored), and a bind mount of ./db would impose the host uid on
      # /app/db. Docker seeds this volume from the image's /app/db, which is
      # owned by the unprivileged app user, so the SQLite store is created on
      # first run with the right permissions.
      - auth_data:/app/db
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  auth_data:
  pg_data:

