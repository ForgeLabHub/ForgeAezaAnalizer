# Явная конфигурация: результат линта не зависит от того, какой ruff лежит первым
# в PATH и какие правила он считает включёнными по умолчанию.
#
# Блокирующий набор — то, что ломает исполнение и почти всегда указывает на баг:
# синтаксис (E9), неопределённые имена и неиспользуемые импорты/переменные (F).
# Строгие наборы (I, UP, BLE, ISC, SIM) дают в этом коде сотни замечаний стиля;
# они вынесены в задачу постепенного ужесточения, см. docs/development/code-style.md.
line-length = 100
target-version = "py312"

[lint]
select = ["E9", "F"]
ignore = ["E501"]

[lint.per-file-ignores]
# Тесты описывают сценарии: длинные строки и локальные фикстуры здесь нормальны.
"backend/tests/*" = ["F811"]
