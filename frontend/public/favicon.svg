<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" role="img" aria-label="Aéza">
  <title>Aéza</title>
  <style>
    /* The brand book defines the app icon as the é symbol in two contrasting
       monochrome versions: white on black, and black on white. One file carries
       both, chosen by the browser's colour scheme, so the mark stays legible on
       light and dark browser chrome. */
    .tile { fill: #000000; }
    .glyph { fill: #ffffff; }
    @media (prefers-color-scheme: light) {
      .tile { fill: #ffffff; }
      .glyph { fill: #000000; }
    }
  </style>
