upstream aeza_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # TLS terminates on the host nginx, so HSTS is deliberately not set here:
    # a browser only honours it over HTTPS, and this listener is HTTP-only.
    # The remaining headers are safe on both schemes.
    add_header X-Content-Type-Options "nosniff" always;
    # The Mini App is embedded in Telegram's WebView (web.telegram.org serves it
    # in an iframe), so framing cannot be denied outright. `frame-ancestors`
    # restricts who may frame the app to Telegram's own origins, which is both
    # narrower than DENY's blanket ban for that path and still blocks a random
    # site from framing it. The legacy X-Frame-Options cannot express an allow
    # list, so it is dropped in favour of the CSP directive.
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The SPA is client-routed, so unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # A location with its own add_header stops inheriting the server-level
        # ones, so repeat them here rather than silently dropping them.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /api/ {
        proxy_pass http://aeza_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location = /metrics {
        proxy_pass http://aeza_api/metrics;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://aeza_api/health;
        proxy_set_header Host $host;
    }

    # Without this the readiness probe falls through to the SPA fallback and
    # answers 200 with index.html, which hides a genuinely unready backend.
    location = /ready {
        proxy_pass http://aeza_api/ready;
        proxy_set_header Host $host;
    }
}
