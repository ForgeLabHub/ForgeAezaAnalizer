<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Aeza brand mark, taken from aeza.ru (/favicon.ico, /favicon.png, /apple-touch-icon.png). -->
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="512x512" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#ff6b00" />
    <script>
      // Apply the saved theme before first paint to avoid a light flash in dark mode.
      try {
        var t = localStorage.getItem('aeza-theme')
        document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <meta name="description" content="Aéza Sentinel — анализ риска оттока клиентов и оценка выручки под риском" />
    <title>Aéza · Sentinel</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
